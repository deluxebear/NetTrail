name: Trace
options:
  bundleIdPrefix: com.xiongyanlin
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  TraceCore:
    path: Packages/TraceCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(TRACE_TEAM_ID)
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Trace:
    type: application
    platform: macOS
    sources: [Trace]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACE_BUNDLE_ID)
        PRODUCT_NAME: NetTrail
        PRODUCT_MODULE_NAME: Trace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Trace/Info.plist
      properties:
        CFBundleName: NetTrail
        CFBundleDisplayName: NetTrail
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        TraceFilterMachService: $(TRACE_MACH_SERVICE)
        TraceTeamID: $(TRACE_TEAM_ID)
    entitlements:
      path: Trace/Trace.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [$(TRACE_NE_FILTER)]
    dependencies:
      - package: TraceCore
        product: TraceCore
      - package: TraceCore
        product: TraceKit
      - target: TraceFilter
  TraceFilter:
    type: system-extension
    platform: macOS
    sources: [TraceFilter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACE_BUNDLE_ID).filter
        PRODUCT_NAME: $(TRACE_BUNDLE_ID).filter
        PRODUCT_MODULE_NAME: TraceFilter
    info:
      path: TraceFilter/Info.plist
      properties:
        CFBundleDisplayName: NetTrail Filter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: SYSX
        TraceTeamID: $(TRACE_TEAM_ID)
        NSSystemExtensionUsageDescription: NetTrail uses a content filter to record the domains each app connects to. It never blocks any connection.
        NetworkExtension:
          NEMachServiceName: $(TRACE_MACH_SERVICE)
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    entitlements:
      path: TraceFilter/TraceFilter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TRACE_APP_GROUP)]
        com.apple.developer.networking.networkextension: [$(TRACE_NE_FILTER)]
    dependencies:
      - package: TraceCore
        product: TraceCore
