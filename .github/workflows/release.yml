name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]   # per-arch DMGs are far smaller than one universal build
    steps:
      - uses: actions/checkout@v5

      - name: Test
        if: matrix.arch == 'arm64'
        run: swift test --package-path Packages/TraceCore

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing assets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.TRACE_APP_PROFILE }}
          FILTER_PROFILE_B64: ${{ secrets.TRACE_FILTER_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"; PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          test -n "$IDENTITY" || { echo "::error::No Developer ID Application certificate in p12"; exit 1; }
          echo "$APP_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.provisioningprofile"
          echo "$FILTER_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/filter.provisioningprofile"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "APP_PROFILE=$RUNNER_TEMP/app.provisioningprofile"
            echo "FILTER_PROFILE=$RUNNER_TEMP/filter.provisioningprofile"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_KEY_ID=${{ secrets.ASC_KEY_ID }}"
            echo "ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          scripts/release.sh

      - name: Verify
        run: |
          APP="build/release-${{ matrix.arch }}/export/NetTrail.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/NetTrail"

      - uses: actions/upload-artifact@v7
        with:
          name: NetTrail-${{ matrix.arch }}
          path: build/NetTrail-*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v5
        with:
          pattern: NetTrail-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAG=""; [[ "$GITHUB_REF_NAME" == *-* ]] && FLAG="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "NetTrail ${GITHUB_REF_NAME#v}" --generate-notes $FLAG dist/*.dmg
